services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Volume YOK ve kalıcılık kapalı: Redis burada kalıcı kaynak değil,
    # Postgres'in TAM KOPYASI. Yeniden başlarsa uygulama warm-up ile
    # onu Postgres'ten yeniden doldurur.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]   # PONG dönerse hazır
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy   # Postgres HAZIR olmadan uygulama başlamaz
      redis:
        condition: service_healthy   # aynı gerekçe: bağlantı reddedilmesin
    env_file: .env                    # JWT_SECRET, GROQ_*, TTL'ler...
    environment:
      DB_HOST: db                     # .env'deki 127.0.0.1'i EZER (servis adı)
      DB_PORT: "5432"
      REDIS_ADDR: redis:6379          # servis adı; container dışından farklıdır
      GIN_MODE: release               # gin otomatik okur, debug log kapanır
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata: