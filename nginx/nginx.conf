events {}

http {
    # Docker'ın gömülü DNS sunucusu.
    #
    # valid=10s: nginx DNS cevaplarını önbelleğe alır. Kopya sayısı
    # değiştiğinde (--scale) yeni konteynerleri görebilmek için kısa tutuldu.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;

        location / {
            # TUZAK 1 — proxy_pass'a sabit isim yazılırsa (proxy_pass
            # http://app:8080;) nginx DNS'i AÇILIŞTA bir kez çözer ve tek
            # kopyaya takılı kalır; ölçekleme işe yaramaz. Değişken
            # kullanmak nginx'i her istekte yeniden çözmeye zorlar.
            set $upstream "app:8080";
            proxy_pass http://$upstream$request_uri;

            proxy_set_header Host $host;

            # TUZAK 2 — burada yaygın örneklerde $proxy_add_x_forwarded_for
            # kullanılır; o, istemcinin GÖNDERDİĞİ başlığın SONUNA gerçek
            # adresi ekler. Sonuç: "9.9.9.9, 172.18.0.5". Uygulama vekile
            # güvendiği için soldaki sahte değeri gerçek istemci sanar —
            # yani az önce kapattığımız açık geri gelir.
            #
            # $remote_addr ise istemcinin yazdığını YOK SAYIP üzerine gerçek
            # bağlantı adresini yazar. Sahtelenemez.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Chat istekleri LLM'i beklediği için uzun sürebilir.
            proxy_read_timeout 60s;
        }
    }
}
